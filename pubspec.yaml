name: daftar_alhisabat
description: Offline-first bilingual multi-ledger accounting app for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  provider: ^6.1.2
  share_plus: ^9.0.0
  pdf: ^3.11.0
  printing: ^5.13.1
  excel: ^4.0.3
  file_picker: ^8.0.0+1
  flutter_local_notifications: ^17.1.2
  local_auth: ^2.2.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  generate: false

  # The app is intentionally architecture-first and offline-first.
  assets:
    - assets/images/

  # You can add app fonts later when needed.
